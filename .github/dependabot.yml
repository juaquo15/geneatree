version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    ignore:
      # svelte-check aún no soporta TypeScript 7 (peer ^5 || ^6)
      - dependency-name: typescript
        versions: ['>=7']
      # Tipos alineados con Node 24 (el runtime usado en CI)
      - dependency-name: '@types/node'
        versions: ['>=25']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
