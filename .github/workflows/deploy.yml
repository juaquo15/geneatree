name: Publicar

# Publica la app en Cloudflare Pages (geneatree.pages.dev) solo si CI pasó en main.
# El sitio no contiene datos: cada visitante carga su propio GEDCOM.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://geneatree.pages.dev
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build

      - id: cf
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # El proyecto debe existir antes del primer despliegue.
          preCommands: |
            wrangler pages project list | grep -qw geneatree || wrangler pages project create geneatree --production-branch=main
          command: pages deploy dist --project-name=geneatree --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # S-05 (servidor): los encabezados de seguridad llegan en la respuesta real.
      - name: Verificar encabezados de seguridad
        env:
          URL: ${{ steps.cf.outputs.deployment-url }}
        run: |
          sleep 10
          h=$(curl -sSI "$URL")
          echo "$h"
          for needle in "frame-ancestors 'none'" "script-src 'self'" "x-content-type-options: nosniff" "strict-transport-security"; do
            echo "$h" | grep -qi "$needle" || { echo "::error::Falta en la respuesta: $needle"; exit 1; }
          done
